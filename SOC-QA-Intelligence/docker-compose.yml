version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: socqa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: socqa_user
      POSTGRES_PASSWORD: socqa_research_pass
      POSTGRES_DB: socqa_intelligence
    ports:
      - "5432:5432"
    volumes:
      - socqa_pgdata:/var/lib/postgresql/data
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socqa_user -d socqa_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: socqa_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://socqa_user:socqa_research_pass@postgres:5432/socqa_intelligence
      USE_SQLITE_FALLBACK: "false"
      AI_MODULE_ENABLED: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

volumes:
  socqa_pgdata:
